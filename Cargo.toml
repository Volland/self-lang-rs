[package]
name = "self-world"
version = "0.1.0"
edition = "2021"
description = "A Self language environment written in Rust, with a modern outliner desktop"
license = "BSD-3-Clause"

[lib]
name = "selfworld"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "self-world"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
web-time = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "console"] }
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"
rfd = "0.15"
