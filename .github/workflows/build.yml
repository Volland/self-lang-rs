# Builds Self World for macOS, Linux, Windows and the web on every push.
name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - run: cargo test --release
      - run: cargo build --release --bin self-world
      - uses: actions/upload-artifact@v4
        with:
          name: self-world-${{ runner.os }}
          path: |
            target/release/self-world
            target/release/self-world.exe
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.128
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: self-world-web
          path: dist
